[project]
name = "monster-scraper"
version = "2.0.0"
description = "Scrape every Monster Energy can listed on monsterenergy.com, across all locales."
readme = "README.md"
authors = [{ name = "Federico Calabrò" }]
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.16.3",
    "pillow>=12.3.0",
    "selectolax>=0.4.12",
    "typer>=0.27.2",
]

[project.scripts]
monster-scraper = "monster_scraper.cli:app"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
